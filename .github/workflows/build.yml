name: Build and Release

on:
  push:
    branches: [ main, develop, test ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
    
    - name: Publish
      run: dotnet publish --configuration Release --output ./publish --no-build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ClipSync-Windows-${{ github.sha }}
        path: ./publish/
    
  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Publish Release
      run: dotnet publish --configuration Release --output ./release --self-contained true --runtime win-x64
    
    - name: Create Release Archive
      run: |
        Compress-Archive -Path ./release/* -DestinationPath ClipSync-Windows-${{ github.ref_name }}.zip
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ClipSync Windows ${{ github.ref_name }}
        body: |
          ## What's Changed
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          
          ## Installation
          
          1. Download `ClipSync-Windows-${{ github.ref_name }}.zip`
          2. Extract to your desired location
          3. Run `ClipSyncWindows.exe`
          
          ## Requirements
          
          - Windows 10 version 1903+ or Windows 11
          - .NET 9.0 Runtime (included in self-contained build)
          - Bluetooth adapter
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./ClipSync-Windows-${{ github.ref_name }}.zip
        asset_name: ClipSync-Windows-${{ github.ref_name }}.zip
        asset_content_type: application/zip
